server.port=8080
spring.application.name=in-memory-search-engine

# --- Actuator (Task 4.1) ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true

# --- Graceful shutdown (Task 4.5) ---
# Wait for in-flight requests to finish before the JVM stops, so no indexing
# or search work is abruptly killed.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# --- Structured (JSON) logging (Task 4.3) ---
# A single-line JSON-ish layout makes logs easy to ingest into log aggregators.
logging.pattern.console={"time":"%d{yyyy-MM-dd'T'HH:mm:ss.SSS}","level":"%level","logger":"%logger{36}","thread":"%thread","msg":"%msg"}%n
logging.level.app.service=DEBUG
logging.level.root=INFO
